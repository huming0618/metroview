<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>地铁全景 · Metro View</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E🚇%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="top-bar" role="search">
        <div class="search-wrap">
          <input
            id="search-input"
            type="search"
            enterkeyhint="search"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            placeholder="搜索城市 / 地铁系统（中英）"
            aria-label="搜索地铁"
          />
          <button id="clear-search" class="icon-btn" type="button" aria-label="清除" hidden>×</button>
        </div>
        <ul id="search-results" class="search-results" hidden role="listbox"></ul>
      </header>

      <div id="map" aria-label="地铁地图"></div>

      <div id="offline-banner" class="offline-banner" hidden></div>
      <div id="status" class="status" hidden></div>

      <aside id="sheet" class="sheet" hidden>
        <div class="sheet-handle" aria-hidden="true"></div>
        <div class="sheet-body">
          <h2 id="sheet-title" class="sheet-title"></h2>
          <p id="sheet-meta" class="sheet-meta"></p>
          <p id="sheet-codes" class="sheet-codes"></p>
          <div class="sheet-actions">
            <button id="btn-fit" type="button" class="btn primary">定位到此线网</button>
            <button id="btn-cache" type="button" class="btn accent">缓存此城市离线地图</button>
            <button id="btn-world" type="button" class="btn">返回全球视图</button>
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
